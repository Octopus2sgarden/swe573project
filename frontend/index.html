<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indigenous Crafts Platform</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <h1>Indigenous Crafts Platform</h1>
    <p>Document Indigenous and traditional crafts: their stories, materials, techniques and the places where they come from.</p>

    <article x-data="{ state: 'loading', body: null }"
             x-init="api.get('/health')
               .then(r => { state = r.ok ? 'up' : 'down'; body = r.body; })
               .catch(() => { state = 'down'; })">
      <header><strong>System status</strong></header>
      <p x-show="state === 'loading'" aria-busy="true">Checking the backend…</p>
      <p x-show="state === 'up'" class="status-up">Backend and database are running.</p>
      <p x-show="state === 'down'" class="status-down">The backend or the database is not reachable.</p>
      <small x-show="body" x-text="JSON.stringify(body)"></small>
    </article>
  </main>

  <footer id="site-footer"></footer>
  <script src="/js/layout.js"></script>
</body>
</html>
