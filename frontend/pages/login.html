<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Indigenous Crafts Platform</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <h1>Log in</h1>

    <form x-data="loginForm()" @submit.prevent="submit">
      <label>
        Email
        <input type="email" x-model="email" required autocomplete="email">
      </label>
      <label>
        Password
        <input type="password" x-model="password" required autocomplete="current-password">
      </label>

      <p x-show="error" x-text="error"></p>

      <button type="submit" :aria-busy="loading" :disabled="loading">Log in</button>
    </form>
  </main>

  <footer id="site-footer"></footer>
  <script src="/js/layout.js"></script>
    <script>
    function loginForm() {
      return {
        email: "",
        password: "",
        error: "",
        loading: false,

        async submit() {
          this.error = "";
          this.loading = true;
          const res = await api.post("/auth/login", { email: this.email, password: this.password });
          this.loading = false;

          if (res.ok) {
            console.log("token:", res.body.accessToken); // TODO: storage kararından sonra değişecek
            window.location.href = "/";
          } else if (res.status === 401) {
            this.error = "Wrong Password. Please try again";
          } else {
            this.error = "Something went wrong. Please try again.";
          }
        }
      };
    }
  </script>
</body>
</html>
