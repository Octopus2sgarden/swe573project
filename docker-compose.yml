services:
  db:
    image: postgis/postgis:17-3.5
    # The official PostGIS image is published for amd64 only.
    # On Apple Silicon (arm64) Docker runs it through emulation (Rosetta).
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${DB_NAME:-crafts}
      POSTGRES_USER: ${DB_USER:-crafts}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crafts}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crafts} -d ${DB_NAME:-crafts}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-crafts}
      DB_USER: ${DB_USER:-crafts}
      DB_PASSWORD: ${DB_PASSWORD:-crafts}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set in .env}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8000}:80"
    depends_on:
      - backend

volumes:
  db-data:
