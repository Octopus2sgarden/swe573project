spring:
  application:
    name: indigenous-crafts-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crafts}
    username: ${DB_USER:crafts}
    password: ${DB_PASSWORD:crafts}
  jpa:
    hibernate:
      # The schema is managed by Flyway migrations, Hibernate only checks it.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    # Base64-encoded HMAC key, at least 32 bytes. Comes from .env, never committed.
    secret: ${JWT_SECRET}
    ttl: 1h